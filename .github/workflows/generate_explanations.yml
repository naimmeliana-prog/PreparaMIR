name: Actualización Diaria Explicaciones MIR

on:
  workflow_dispatch: # Permite lanzar la ejecución manualmente desde GitHub

jobs:
  update-explanations:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para hacer commits y push en el repositorio

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de explicaciones (límite 1050)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          python scripts/generate_explanations.py auto 1050

      - name: Commit y Push de los JSON actualizados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/lib/data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update MIR justifications (cron)" && git push)
